<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Academia Web</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h2><a href="index.html">Academia Web</a></h2>
    <nav class="header--nav">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="cursos.html">Cursos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="acceso">
      <article class="formulario">
        <h1>Creá tu cuenta</h1>
        <p class="descripcion">Sumate a Academia Web y empezá a aprender.</p>
        <form action="#" method="post">
          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" autocomplete="name" minlength="3" required>
          </div>
          <div class="campo">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="campo">
            <label for="confirmar-password">Confirmar contraseña</label>
            <input type="password" id="confirmar-password" name="confirmar-password" placeholder="Repetí tu contraseña" autocomplete="new-password" minlength="8" required>
          </div>
          <label class="aceptacion">
            <input type="checkbox" name="terminos" required>
            <span>Acepto los términos y condiciones.</span>
          </label>
          <button type="submit">Crear cuenta</button>
        </form>
        <p class="alternativa">¿Ya tenés una cuenta? <a href="login.html">Iniciá sesión</a></p>
      </article>
    </section>
  </main>

  <footer><p>© 2026 Academia Web</p></footer>
</body>
</html>
